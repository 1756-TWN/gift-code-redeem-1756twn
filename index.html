<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:title" content="🎁 Kingshot Alliance Batch Redeem | Hot×Gie"/>
		<meta property="og:description" content="Redeem gift codes for 1756 TWN"/>
		<meta property="og:url" content="https://ks-transfer-ranking.github.io/kingdom-ranker/"/>
		<meta property="og:image"content="/kingdom-ranker/og-image.jpeg"/>
		<link rel="apple-touch-icon" sizes="180x180" href="/kingdom-ranker/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/kingdom-ranker/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/kingdom-ranker/favicon-16x16.png">
		<link rel="manifest" href="/kingdom-ranker/site.webmanifest">
    <title>🎁 Kingshot Alliance Batch Redeem | Hot×Gie</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --bg-table-head: #0b1120;
            --bg-row-active: rgba(250, 204, 21, 0.08);
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --btn-primary: #0284c7;
            --btn-hover: #0369a1;
            --btn-retry: #d97706;
            --btn-retry-hover: #b45309;
            --btn-disabled: #475569;
            --status-pending: #94a3b8;
            --status-pending-bg: rgba(148, 163, 184, 0.15);
            --status-running: #facc15;
            --status-running-bg: rgba(250, 204, 21, 0.18);
            --status-success: #4ade80;
            --status-success-bg: rgba(74, 222, 128, 0.15);
            --status-error: #f87171;
            --status-error-bg: rgba(248, 113, 113, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2.5rem 1rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 940px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            height: fit-content;
        }

        .header {
            margin-bottom: 1.75rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-blue); margin-bottom: 0.35rem; }
        .header .subtitle { font-size: 0.9rem; color: var(--text-secondary); }

        .input-group { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }

        .input-group input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: var(--text-primary);
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .input-group input[type="text"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--btn-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) { background-color: var(--btn-hover); }
        button:disabled { background-color: var(--btn-disabled); cursor: not-allowed; opacity: 0.7; }

        .btn-retry-all {
            background-color: var(--btn-retry);
            padding: 0.45rem 1rem;
            font-size: 0.85rem;
        }

        .btn-retry-all:hover:not(:disabled) { background-color: var(--btn-retry-hover); }

        .btn-retry-one {
            background-color: transparent;
            border: 1px solid var(--btn-retry);
            color: var(--status-running);
            padding: 0.25rem 0.65rem;
            font-size: 0.78rem;
            border-radius: 6px;
        }

        .btn-retry-one:hover:not(:disabled) {
            background-color: var(--btn-retry);
            color: #ffffff;
        }

        .status-box {
            display: none;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.5rem;
            font-size: 0.92rem;
            background-color: var(--bg-input);
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }

        .status-box.info { border-left-color: var(--accent-blue); }
        .status-box.success { border-left-color: var(--status-success); }
        .status-box.error { border-left-color: var(--status-error); }

        .result-section { display: none; }

        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            background-color: var(--bg-input);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .summary-stats { display: flex; flex-wrap: wrap; gap: 1.25rem; }
        .summary-stats .stat-total { color: var(--text-primary); }
        .summary-stats .stat-progress { color: var(--accent-blue); }
        .summary-stats .stat-ok { color: var(--status-success); }
        .summary-stats .stat-fail { color: var(--status-error); }

        .table-wrapper {
            width: 100%;
            max-height: 520px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            scroll-behavior: smooth;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-table-head);
            color: var(--text-secondary);
            font-weight: 600;
            text-align: left;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        tbody td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr.row-active { background-color: var(--bg-row-active); }

        .col-index { width: 50px; color: var(--text-muted); }
        .col-nickname { font-weight: 500; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-fid { font-family: monospace; color: var(--text-secondary); width: 120px; }
        .col-status { width: 125px; }
        .col-action { width: 95px; text-align: right; }

        .badge {
            display: inline-block;
            padding: 0.22rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.pending { background-color: var(--status-pending-bg); color: var(--status-pending); }
        .badge.running { background-color: var(--status-running-bg); color: var(--status-running); animation: pulse 1.2s infinite; }
        .badge.success { background-color: var(--status-success-bg); color: var(--status-success); }
        .badge.error { background-color: var(--status-error-bg); color: var(--status-error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Kingshot Alliance Batch Redeem</h1>
            <p class="subtitle">Real-time member sync (KID 1756 &bull; TWN) &amp; live redemption progress.</p>
        </header>

        <section class="input-group">
            <input type="text" id="giftCodeInput" placeholder="Enter Gift Code (e.g. KS1111)" autocomplete="off" onkeydown="if (event.key === 'Enter') startRedeem()" />
            <button id="redeemBtn" onclick="startRedeem()">Redeem for All</button>
        </section>

        <div id="statusBox" class="status-box info"></div>

        <section id="resultSection" class="result-section">
            <div class="summary-bar">
                <div id="summaryStats" class="summary-stats"></div>
                <button id="retryAllBtn" class="btn-retry-all" style="display: none;" onclick="retryAllFailed()">Retry All Failed</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="col-index">#</th>
                            <th>Nickname</th>
                            <th>FID</th>
                            <th>Status</th>
                            <th>Message</th>
                            <th class="col-action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const DELAY_MS = 3200;
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
				const apiBaseUrl = "https://gift-code-redeem-1756twn.vercel.app";

        let currentCode = "";
        let currentKid = "1756";
        let memberList = [];
        let isBatchRunning = false;

        function updateSummaryUI() {
            const total = memberList.length;
            const processed = memberList.filter(m => m.status === "success" || m.status === "error").length;
            const successCount = memberList.filter(m => m.status === "success").length;
            const failCount = memberList.filter(m => m.status === "error").length;

            document.getElementById("summaryStats").innerHTML = [
                '<span class="stat-total">Total: ' + total + '</span>',
                '<span class="stat-progress">Progress: ' + processed + ' / ' + total + '</span>',
                '<span class="stat-ok">Success: ' + successCount + '</span>',
                '<span class="stat-fail">Failed: ' + failCount + '</span>'
            ].join("");

            const retryAllBtn = document.getElementById("retryAllBtn");
            if (failCount > 0 && !isBatchRunning) {
                retryAllBtn.style.display = "inline-block";
                retryAllBtn.innerText = "Retry All Failed (" + failCount + ")";
                retryAllBtn.disabled = false;
            } else if (isBatchRunning) {
                retryAllBtn.disabled = true;
            } else {
                retryAllBtn.style.display = "none";
            }
        }

        function setControlsDisabled(disabled) {
            isBatchRunning = disabled;
            document.getElementById("redeemBtn").disabled = disabled;
            document.getElementById("giftCodeInput").disabled = disabled;

            document.querySelectorAll(".btn-retry-one").forEach(btn => {
                btn.disabled = disabled;
            });
            updateSummaryUI();
        }

        async function processSinglePlayer(idx, scrollIntoView = false) {
            const member = memberList[idx];
            if (!member) return;

            const row = document.getElementById("member-row-" + idx);
            const badge = document.getElementById("badge-" + idx);
            const msg = document.getElementById("msg-" + idx);
            const actionCell = document.getElementById("action-" + idx);

            member.status = "running";
            if (row) {
                row.classList.add("row-active");
                if (scrollIntoView) row.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
            if (badge) {
                badge.className = "badge running";
                badge.textContent = "Redeeming...";
            }
            if (msg) {
                msg.style.color = "var(--status-running)";
                msg.textContent = "Sending request...";
            }
            if (actionCell) {
                actionCell.innerHTML = "";
            }

            try {
                const response = await fetch(`${apiBaseUrl}/api/codeRedeem`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: "redeemOne",
                        giftCode: currentCode,
                        fid: member.fid,
                        kid: currentKid
                    })
                });

                const data = await response.json();
                const isSuccess = data.status === "success";

                member.status = isSuccess ? "success" : "error";
                member.message = data.message || "Unknown response";
            } catch (err) {
                member.status = "error";
                member.message = "Network error: " + err.message;
            }

            if (row) row.classList.remove("row-active");
            if (badge) {
                badge.className = "badge " + (member.status === "success" ? "success" : "error");
                badge.textContent = member.status === "success" ? "Success" : "Failed";
            }
            if (msg) {
                msg.style.color = "var(--text-primary)";
                msg.textContent = member.message;
            }
            if (actionCell && member.status === "error") {
                const retryBtn = document.createElement("button");
                retryBtn.className = "btn-retry-one";
                retryBtn.textContent = "Retry";
                retryBtn.disabled = isBatchRunning;
                retryBtn.onclick = () => retrySinglePlayer(idx);
                actionCell.appendChild(retryBtn);
            }

            updateSummaryUI();
        }

        async function retrySinglePlayer(idx) {
            if (isBatchRunning) return;
            const statusBox = document.getElementById("statusBox");
            const member = memberList[idx];

            setControlsDisabled(true);
            statusBox.className = "status-box info";
            statusBox.innerText = "Retrying single member: " + member.nick_name + " (" + member.fid + ")...";

            await processSinglePlayer(idx, false);

            statusBox.className = member.status === "success" ? "status-box success" : "status-box error";
            statusBox.innerText = "Single retry finished for " + member.nick_name + ": " + member.message;
            setControlsDisabled(false);
        }

        async function retryAllFailed() {
            if (isBatchRunning) return;
            const failedIndices = memberList
                .map((m, idx) => (m.status === "error" ? idx : -1))
                .filter(idx => idx !== -1);

            if (failedIndices.length === 0) return;

            const statusBox = document.getElementById("statusBox");
            setControlsDisabled(true);
            statusBox.className = "status-box info";

            for (let i = 0; i < failedIndices.length; i++) {
                const targetIdx = failedIndices[i];
                const member = memberList[targetIdx];
                statusBox.innerText = "Retrying failed (" + (i + 1) + "/" + failedIndices.length + "): " + member.nick_name + " (" + member.fid + ")...";

                await processSinglePlayer(targetIdx, true);

                if (i < failedIndices.length - 1) {
                    await sleep(DELAY_MS);
                }
            }

            statusBox.className = "status-box success";
            statusBox.innerText = "Completed retrying all failed members for code: " + currentCode;
            setControlsDisabled(false);
        }
        async function startRedeem() {
            const input = document.getElementById("giftCodeInput");
            const btn = document.getElementById("redeemBtn");
            const statusBox = document.getElementById("statusBox");
            const resultSection = document.getElementById("resultSection");
            const tbody = document.getElementById("resultsTableBody");

            const giftCode = input.value.trim();
            if (!giftCode) {
                alert("Please enter a valid gift code.");
                input.focus();
                return;
            }

            currentCode = giftCode;
            memberList = [];
            tbody.innerHTML = "";
            resultSection.style.display = "none";

            setControlsDisabled(true);
            btn.innerText = "Running...";
            statusBox.className = "status-box info";
            statusBox.style.display = "block";
            statusBox.innerText = "Fetching latest alliance member list...";

            try {
                const listRes = await fetch(`${apiBaseUrl}/api/codeRedeem`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "getMembers" })
                });

                const listData = await listRes.json();
                if (!listRes.ok || !listData.success) {
                    throw new Error(listData.error || "Failed to load member list");
                }

                currentKid = listData.kid;
                memberList = listData.members.map(m => ({
                    fid: m.fid,
                    nick_name: m.nick_name,
                    status: "pending",
                    message: "Waiting in queue..."
                }));

                memberList.forEach((m, idx) => {
                    const tr = document.createElement("tr");
                    tr.id = "member-row-" + idx;

                    const tdIdx = document.createElement("td");
                    tdIdx.className = "col-index";
                    tdIdx.textContent = idx + 1;

                    const tdNick = document.createElement("td");
                    tdNick.className = "col-nickname";
                    tdNick.title = m.nick_name;
                    tdNick.textContent = m.nick_name;

                    const tdFid = document.createElement("td");
                    tdFid.className = "col-fid";
                    tdFid.textContent = m.fid;

                    const tdStatus = document.createElement("td");
                    tdStatus.className = "col-status";
                    tdStatus.innerHTML = '<span id="badge-' + idx + '" class="badge pending">Pending</span>';

                    const tdMsg = document.createElement("td");
                    tdMsg.id = "msg-" + idx;
                    tdMsg.style.color = "var(--text-muted)";
                    tdMsg.textContent = m.message;

                    const tdAction = document.createElement("td");
                    tdAction.id = "action-" + idx;
                    tdAction.className = "col-action";

                    tr.append(tdIdx, tdNick, tdFid, tdStatus, tdMsg, tdAction);
                    tbody.appendChild(tr);
                });

                updateSummaryUI();
                resultSection.style.display = "block";

                for (let i = 0; i < memberList.length; i++) {
                    const member = memberList[i];
                    statusBox.innerText = "Redeeming (" + (i + 1) + "/" + memberList.length + "): " + member.nick_name + " (" + member.fid + ")...";

                    await processSinglePlayer(i, true);

                    if (i < memberList.length - 1) {
                        await sleep(DELAY_MS);
                    }
                }

                statusBox.className = "status-box success";
                statusBox.innerText = "All done! Batch redemption completed for code: " + currentCode;
            } catch (err) {
                statusBox.className = "status-box error";
                statusBox.innerText = "Error: " + err.message;
            } finally {
                btn.innerText = "Redeem for All";
                setControlsDisabled(false);
            }
        }
    </script>
</body>
</html>
